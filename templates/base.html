<!-- 全画面共通部分 -->
{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
    <title>{% block title %}Task App{% endblock %}</title>
</head>

<body>

    <div class="container">

        <header class="app-header">
            <h1 class="app-title">Task & Habit App</h1>

            <nav class="tab-nav">
                <a href="/" class="tab-nav-item {% if request.path == '/' %}is-active{% endif %}">Dashboard</a> 
                <a href="/tasks/" class="tab-nav-item {% if '/tasks/' in request.path %}is-active{% endif %}">Tasks</a> 
                <a href="/habits/" class="tab-nav-item {% if '/habits/' in request.path %}is-active{% endif %}">Habits</a>
                <a href="/schedule/" class="tab-nav-item {% if '/schedule/' in request.path %}is-active{% endif %}">Schedule</a>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>
</html>
