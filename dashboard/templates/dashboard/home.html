{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<h2>ダッシュボード</h2>

<h3>今日のタスク</h3>

<ul>

{% for item in today_items %}

    <li>

        {% if item.type == "task" %}
            📋
        {% else %}
            🔥
        {% endif %}

        {{ item.title }}

    </li>

{% empty %}

    <li>今日やることはありません</li>

{% endfor %}

</ul>

{% endblock %}
