{% extends "base.html" %}

{% block title %}Habits{% endblock %}

{% block content %}
<h2>習慣一覧</h2>

<a href="{% url 'habit_create' %}">＋新規作成</a>

{% for habit in habits %}
    <div>
        <a href="{% url 'habit_detail' habit.id %}">{{ habit.title }}</a>
        <p>{{ habit.status }}</p>

        <a href="{% url 'habit_detail' habit.id %}">詳細</a>
        <a href="{% url 'habit_update' habit.id %}">編集</a>
        <a href="{% url 'habit_delete' habit.id %}">削除</a>
    </div>
{% endfor %}

{% endblock %}
