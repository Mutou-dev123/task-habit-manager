{% extends "base.html" %}

{% block title %}下書き一覧{% endblock %}

{% block content %}
<h2>下書き一覧</h2>

<ul>
{% for habit in habits %}
    <li>
        {{ habit.title }}

        <a href="{% url 'habit_update' habit.id %}" class="btn edit">編集</a>
    </li>
{% empty %}
    <li>下書きはありません</li>
{% endfor %}
</ul>

<a href="{% url 'habit_create' %}" class="btn back">習慣作成へ戻る</a>

{% endblock %}
