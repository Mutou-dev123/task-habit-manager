<!-- 習慣一覧画面読み込み部分テンプレート -->

{% load static %}

{% for habit in habits %}
    <div class="card">

        <a href="{% url 'habit_detail' habit.id %}"
        class="card-main-link">
        </a>

        <h3 style="font-weight: bold; font-size: 18px;">
            {{ habit.title }}
        </h3>

        <p>{{ habit.get_frequency_display }}</p>

        {% if habit.id in done_habit_ids %}

            <span
                class="btn update text-disabled"
                style="
                    text-align:center;
                    cursor:default;
                    background-color:#9e9e9e;
                ">
                ✅ 実施済み
            </span>

        {% else %}

            <button
                type="button"
                class="btn update"
                data-url="{% url 'habit_check' habit.id %}"
                onclick="completeHabit(this)"
                style="
                    text-align:center;
                    margin-bottom:8px;
                    width:100%;
                    border:none;
                    cursor:pointer;
                ">
                ✓ 実施
            </button>

        {% endif %}

        <div class="actions">

            <a
                href="{% url 'habit_detail' habit.id %}"
                class="btn detail"
                title="詳細">
                <i class="fa-solid fa-circle-info"></i>
            </a>

            <a
                href="{% url 'habit_update' habit.id %}"
                class="btn edit"
                title="編集">
                <i class="fa-solid fa-pen"></i>
            </a>

            <button
                onclick="deleteFromList(this)"
                data-url="{% url 'habit_delete' habit.id %}"
                data-title="{{ habit.title }}"
                class="btn delete">

                <i class="fa-solid fa-trash"></i>

            </button>

        </div>

    </div>

{% endfor %}
