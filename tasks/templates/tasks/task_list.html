{% extends "base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}
<h2>タスク一覧</h2>

<a href="{% url 'task_create' %}" class="btn create">＋新規作成</a>

<form method="get" class="inline-form">

    <!-- 検索 -->
    <input
        type="text"
        name="q"
        placeholder="検索"
        value="{{ q }}"
    >

    <select name="status">
        <option value="">すべて</option>

        <option value="todo"
            {% if status == "todo" %}selected{% endif %}>
            未完了
        </option>

        <option value="done"
            {% if status == "done" %}selected{% endif %}>
            完了
        </option>
    </select>
    
    <!-- 並べ替え -->
    <select name="sort">
        <option value=""
            {% if not sort %}selected{% endif %}>
            新しい順
        </option>

        <option value="due"
            {% if sort == "due" %}selected{% endif %}>
            期限順
        </option>

        <option value="title"
            {% if sort == "title" %}selected{% endif %}>
            タイトル順
        </option>
    </select>

    <button type="submit">検索</button>

</form>

<div class="card-grid">
    {% for task in tasks %}
        <div class="card status-{{ task.status }}" style="--task-id: task-{{ task.id }};">
            <a href="{% url 'task_detail' task.id %}" class="card-main-link"></a>

            <h3 class="task-link" style="font-weight: bold; font-size: 18px;">{{ task.title }}</h3>
            <p>{{ task.status }}</p>
    
            <!-- 進行状況に応じてボタン文字変更 -->
            {% if task.status != "done" %}
                <button
                    type="button"
                    class="btn update status-toggle-btn"
                    data-url="{% url 'task_next_status' task.id %}"
                    onclick="toggleTaskStatus(this)"
                    style="text-align: center; margin-bottom: 8px; width: 100%; border: none; cursor: pointer;">
                    {% if task.status == "todo" %}▶ 開始{% elif task.status == "doing" %}✓ 完了{% endif %}
                </button>
            {% else %}
                <span class="btn update text-disabled" style="text-align: center; cursor: default; background-color: #9e9e9e;">✅ 完了済み</span>
            {% endif %}
            
            <!-- アクションボタン -->
            <div class="actions">
                <a href="{% url 'task_detail' task.id %}" class="btn detail" title="詳細">
                    <i class="fa-solid fa-circle-info"></i>
                </a>
                <a href="{% url 'task_update' task.id %}" class="btn edit" title="編集">
                    <i class="fa-solid fa-pen"></i>
                </a> 
                <a href="{% url 'task_delete' task.id %}" class="btn delete" title="削除">
                    <i class="fa-solid fa-trash"></i>
                </a>
            </div>
        </div>
    {% empty %}
        <p>タスクはありません</p>
        <a href="{% url 'task_create' %}">タスク作成</a>
    {% endfor %}
</div>

<script>
function toggleTaskStatus(button) {
    const url = button.dataset.url;
    const card = button.closest('.card');

    if (document.startViewTransition) {
        document.startViewTransition(async () => {

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (response.ok) {
                    const currentUrl = window.location.href;
                    const pageResponse = await fetch(currentUrl);
                    const pageHtml = await pageResponse.text();

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(pageHtml, 'text/html');
                    const newGrid = doc.querySelector('.card-grid');

                    if (newGrid) {
                        document.querySelector('.card-grid').innerHTML = newGrid.innerHTML;
                    }
                } else {
                    alert('ステータスの更新に失敗しました。');
                }
            } catch(error) {
                console.error('Error', error);
            }
        });
    } else {
        fetch(url, { method: 'GET', headers: {'X-Requested-With': 'XMLHttpRequest' } })
        then(res => { if (res.ok) window.location.reload(); });
    }

}
// ページが読み込まれたとき、記憶していたスクロール位置があれば復元する
document.addEventListener('DOMContentLoaded', () => {
    const scrollPosition = localStorage.getItem('scrollPosition');
    if (scrollPosition) {
        window.scrollTo(0, parseInt(scrollPosition, 10));
        localStorage.removeItem('scrollPosition');   // 使い終わったら削除する
    }
});
</script>

{% endblock %}
