{% extends "base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}
<h2>タスク一覧</h2>

<a href="{% url 'task_create' %}" class="btn create">＋新規作成</a>

<form method="get" class="inline-form">

    <!-- 検索 -->
    <input
        type="text"
        name="q"
        placeholder="検索"
        value="{{ q }}"
    >

    <select name="status">
        <option value="">すべて</option>

        <option value="todo"
            {% if status == "todo" %}selected{% endif %}>
            未完了
        </option>

        <option value="done"
            {% if status == "done" %}selected{% endif %}>
            完了
        </option>
    </select>
    
    <!-- 並べ替え -->
    <select name="sort">
        <option value=""
            {% if not sort %}selected{% endif %}>
            新しい順
        </option>

        <option value="due"
            {% if sort == "due" %}selected{% endif %}>
            期限順
        </option>

        <option value="title"
            {% if sort == "title" %}selected{% endif %}>
            タイトル順
        </option>
    </select>

    <button type="submit">検索</button>

</form>

<div class="card-grid" data-has-next="{{ has_next|yesno:'true,false' }}" data-page="1">
    {% include "tasks/task_list_partials.html" %}
</div>

<div id="infinite-scroll-trigger" style="text-align: center; padding: 20px; font-weight: bold; color: #9e9e9e;">
    {% if has_next %}読み込み中...{% endif %}
</div>

<script>
function toggleTaskStatus(button) {
    const url = button.dataset.url;
    const card = button.closest('.card');

    if (document.startViewTransition) {
        document.startViewTransition(async () => {

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (response.ok) {
                    const currentUrl = window.location.href;
                    const pageResponse = await fetch(currentUrl);
                    const pageHtml = await pageResponse.text();

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(pageHtml, 'text/html');
                    const newGrid = doc.querySelector('.card-grid');

                    if (newGrid) {
                        document.querySelector('.card-grid').innerHTML = newGrid.innerHTML;
                    }
                } else {
                    alert('ステータスの更新に失敗しました。');
                }
            } catch(error) {
                console.error('Error', error);
            }
        });
    } else {
        fetch(url, { method: 'GET', headers: {'X-Requested-With': 'XMLHttpRequest' } })
        then(res => { if (res.ok) window.location.reload(); });
    }

}
// ページが読み込まれたとき、記憶していたスクロール位置があれば復元する
document.addEventListener('DOMContentLoaded', () => {
    const scrollPosition = localStorage.getItem('scrollPosition');
    if (scrollPosition) {
        window.scrollTo(0, parseInt(scrollPosition, 10));
        localStorage.removeItem('scrollPosition');   // 使い終わったら削除する
    }
});

// 自動無限スクロール
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.querySelector('.card-grid');
    const trigger = document.getElementById('infinite-scroll-trigger');

    if (!trigger || grid.dataset.hasNext === 'false') return;

    let page = 1;
    let isLoading = false;

    // 画面の一番下（trigger）が見えたら発動するセンサー
    const observer = new IntersectionObserver(async (entries) => {
        if (entries[0].isIntersecting && !isLoading && grid.dataset.hasNext === 'true') {
            isLoading = true;
            page++;

            // 現在の検索条件（URLパラメータ）を引き継ぎつつ、次のページを要求
            const currentParams = new URLSearchParams(window.location.search);
            currentParams.set('page', page);

            try {
                const response = await fetch(`${window.location.pathname}?${currentParams.toString()}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (response.ok) {
                    const html = await response.text();

                    // Djangoから届いた「次があるか」の合図を確認
                    const hasNextHeader = response.headers.get('X-Has-Next');

                    // 新しいカードをグリッドの末尾に滑らか追加
                    if (document.startViewTransition) {
                        document.startViewTransition(() => {
                            grid.insertAdjacentHTML('beforeend', html);
                        });
                    } else {
                        grid.insertAdjacentHTML('beforeend', html);
                    }

                    // 次のページがない場合、終了
                    if (hasNextHeader === 'false' || html.trim() ==="") {
                        grid.dataset.hasNext = 'false';
                        trigger.textContent = "すべてのタスクを表示しました";
                        observer.unobserve(trigger);    // センサー停止
                    }
                }
            } catch (error) {
                console.error('Error fetching next page:', error);
            } finally {
                isLoading = false;
            }
        }
    }, { rootMargin: '200px' });    // 一番下に着く前（200px上）から先読み開始

    observer.observe(trigger);
});
</script>

{% endblock %}
