{% extends "base.html" %}

{% block title %}下書きタスク一覧{% endblock %}

{% block content %}
<h2>下書きタスク一覧</h2>

<ul>
{% for task in drafts %}
    <li>
        {{ task.title }}

        <a href="{% url 'task_update' task.id %}" class="btn edit">編集</a>
    </li>
{% empty %}
    <li>下書きはありません</li>
{% endfor %}
</ul>

<div class="actions">
    {% if request.GET.from == 'create' %}
        <a href="{% url 'task_create' %}" class="btn back">タスク作成画面へ戻る</a>
    {% else %}
        <a href="{% url 'task_list' %}" class="btn back">タスク一覧へ戻る</a>
    {% endif %}
</div>

{% endblock %}
